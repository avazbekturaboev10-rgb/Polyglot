const cur=()=>L.st[L.i];
function ad(j){const s=cur();if(!s.r&&!s.a.includes(j)){s.a.push(j);render()}}

function res(s,ok,c){s.r=ok?1:2;s.c=c;S.tot++;L.n++;if(ok){S.ok++;L.ok++}else if(!s.rt&&!L.rv&&s.t!="mt")L.st.push(s.q!==undefined?{t:s.t,q:s.q,rt:1}:{t:s.t,w:s.w,rt:1});save();render()}
function ck(){const s=cur(),a=s.a.map(j=>s.b[j]).join(" "),ok=a==s.w.join(" ")||a==s.w.filter(w=>!P.includes(w)).join(" ");if(!ok)s.w.forEach(w=>S.wrong[w]=(S.wrong[w]||0)+1);res(s,ok,s.w.join(" "))}
function pk(j){const s=cur(),a=s.t=="rev"?s.w:D[s.w],ok=s.o[j]==a;s.p=j;if(!ok)S.wrong[s.w]=(S.wrong[s.w]||0)+1;
if(L.rv&&S.saved[s.w]){const v=S.saved[s.w];v.box=ok?Math.min(4,v.box+1):0;v.due=Date.now()+[0,1,3,7,16][v.box]*864e5}res(s,ok,a)}

if(S.last!=t){S.streak=S.last==day(1)?S.streak+1:1;S.last=t}if(!rv&&!L.pr)S.lesson=Math.max(S.lesson||0,L.no+1);S.L=null;F={xp,acc};L=null;save();render()}
